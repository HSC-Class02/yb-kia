name: Update Kia financial data

on:
  workflow_dispatch:
  schedule:
    # 00:00 UTC = 09:00 Korea Standard Time on the first day of each month
    - cron: "0 0 1 * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/update.yml"
      - "scripts/**"
      - "src/**"
      - "requirements.txt"

permissions:
  contents: write

concurrency:
  group: kia-financial-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Collect and analyze DART financial data
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY || secrets.OPENDART_API_KEY }}
        run: python scripts/update.py
      - name: Commit refreshed dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/data.json data/processed/latest.json data/raw/filings.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: refresh Kia financial dashboard data"
            git push
          fi
